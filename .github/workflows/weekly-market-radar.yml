name: Weekly Market Skill Radar

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Adzuna country codes to collect"
        required: true
        default: "sg"
      pages:
        description: "Pages to fetch per tracked topic"
        required: true
        default: "3"
  schedule:
    # 09:00 every Monday in Singapore/Malaysia time.
    - cron: "0 1 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-market-radar
  cancel-in-progress: false

jobs:
  weekly-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect SG tech jobs
        run: >
          python scripts/collect_adzuna.py
          --countries ${COUNTRIES}
          --pages ${PAGES}
          --results-per-page 20
        env:
          COUNTRIES: ${{ github.event.inputs.countries || 'sg' }}
          PAGES: ${{ github.event.inputs.pages || '3' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      - name: Aggregate dashboard data
        run: python scripts/aggregate_weekly.py

      - name: Build Slack digest preview
        run: |
          mkdir -p data/weekly
          python scripts/create_slack_digest.py --dashboard-url "${DASHBOARD_URL}" > data/weekly/slack_digest.md
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://khawzk.github.io/SGJobRadar/dashboard/' }}

      - name: Validate generated files
        run: |
          python -m json.tool data/latest.json > /dev/null
          python -m py_compile scripts/*.py

      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update weekly market skill radar data"
          file_pattern: data/latest.json data/weekly/*.json data/weekly/*.md
